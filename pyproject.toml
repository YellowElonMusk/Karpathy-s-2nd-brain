[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "radiant-brain"
version = "0.1.0"
description = "RadiantBrain CLI: Git-based second brain — lint, index, and search a Markdown knowledge base"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
radiant = "radiant.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["radiant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
