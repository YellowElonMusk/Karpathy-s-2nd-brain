name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint knowledge base
        run: radiant lint
      - name: Tests
        run: pytest -q
      - name: Build index
        run: radiant index
      - name: Support-agent evals (only when an API key is configured)
        if: env.ANTHROPIC_API_KEY != ''
        run: radiant eval
      - name: Upload index artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: index-db
          path: build/index.db
